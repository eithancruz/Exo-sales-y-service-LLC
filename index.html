<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXO SALES & SERVICE LLC</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Sección Superior - Logotipo y Nombre -->
        <div class="header-section">
            <div class="logo-container">
                <div class="logo">
                    <div class="logo-shape">
                        <div class="logo-part-1"></div>
                        <div class="logo-part-2"></div>
                        <div class="logo-part-3"></div>
                    </div>
                </div>
                <div class="company-name">
                    <h1 class="company-title"></h1>
                    <p class="company-subtitle"></p>
                </div>
            </div>
        </div>

        <!-- Sección Inferior - Iconos de Contacto -->
        <div class="contact-section">
            <div class="contact-icons">
                <div class="contact-item">
                    <a href="https://wa.me/18622792119" target="_blank" rel="noopener noreferrer">
                        <div class="icon whatsapp-icon">
                            <i class="fab fa-whatsapp"></i>
                        </div>
                    </a>
                    <span class="contact-label">WhatsApp</span>
                    <span class="location-text">Newark New Jersey USA</span>
                </div>
                
                <div class="contact-item">
                    <a href="https://www.facebook.com/friends/requests?profile_id=61581724001089&notif_id=1760400768586738&notif_t=friend&ref=notif&locale=es_LA" target="_blank" rel="noopener noreferrer">
                        <div class="icon facebook-icon">
                            <i class="fab fa-facebook-f"></i>
                        </div>
                    </a>
                    <span class="contact-label">Facebook</span>
                </div>
                
                <div class="contact-item">
                    <a href="https://www.instagram.com/exosalesandservices/" target="_blank" rel="noopener noreferrer">
                        <div class="icon instagram-icon">
                            <i class="fab fa-instagram"></i>
                        </div>
                    </a>
                    <span class="contact-label">Instagram</span>
                </div>
                
                <div class="contact-item">
                    <a href="https://www.exosalesandservicesllc.com" target="_blank" rel="noopener noreferrer">
                        <div class="icon website-icon">
                            <i class="fas fa-globe"></i>
                        </div>
                    </a>
                    <span class="contact-label">Página Web</span>
                </div>
                
                <div class="contact-item">
                    <a href="mailto:ramon@exosalesandservicesllc.com">
                        <div class="icon email-icon">
                            <i class="fas fa-envelope"></i>
                        </div>
                    </a>
                    <span class="contact-label">Correo</span>
                </div>
                
                <div class="contact-item">
                    <a href="tel:+19739784160">
                        <div class="icon phone-icon">
                            <i class="fas fa-phone"></i>
                        </div>
                    </a>
                    <span class="contact-label">Teléfono</span>
                    <div id="copy-message" class="copy-message">¡Número copiado!</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
